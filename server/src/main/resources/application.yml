spring:
  application:
    name: toxiproxy_frontend
  config:
    import: "optional:classpath:default.properties"
  datasource:
    url: "jdbc:h2:mem:toxiproxy;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: "classpath:db/changelog/db.changelog-master.xml"

logging:
  level:
    root: INFO
